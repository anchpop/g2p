[package]
name = "g2p"
version = "0.2.0"
edition = "2024"
description = "Grapheme-to-phoneme via a statically linked, data-embedded build of the anchpop/espeak-ng fork"
repository = "https://github.com/anchpop/g2p"
# espeak-ng is GPL-3.0-or-later and is linked statically.
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "g2p"
path = "src/lib.rs"

[[bin]]
name = "g2p"
path = "src/bin/g2p.rs"

[dependencies]
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zstd = "0.13"

[build-dependencies]
cmake = "0.1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"
